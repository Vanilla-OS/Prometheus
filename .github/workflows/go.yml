name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vanilla-os/pico:dev
      options: --cap-add=SYS_ADMIN --security-opt apparmor=unconfined

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install build dependencies
      run: |
          apt-get update
          apt-get install -y podman build-essential pkg-config libbtrfs-dev libdevmapper-dev libgpgme-dev

    - name: Build
      run: go build -v ./...

    - name: Test
      env:
        TMPDIR: ${{ github.workspace }}/.buildah-tmp
      run: |
        mkdir -p "$TMPDIR"
        go test -v ./tests/...
